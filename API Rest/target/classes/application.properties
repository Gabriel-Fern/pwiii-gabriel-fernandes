# Configurações da Loja da Tracen Academy — Umamusume: Pretty Derby
# Este arquivo configura o servidor Spring Boot.
# Equivale às variáveis de ambiente do Node.js (PORT, NODE_ENV, etc.)

# Porta em que o servidor vai escutar — mesma do projeto Node.js anterior
server.port=8080

# Nome da aplicação exibido no log de inicialização
spring.application.name=tracen-api

# Formato da data nos logs do Spring
spring.jackson.serialization.write-dates-as-timestamps=false

# Nível de log: INFO exibe inicialização e requisições sem poluir o console
logging.level.root=INFO
logging.level.com.tracen=DEBUG
